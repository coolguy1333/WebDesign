<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THERE IS NO GAME</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <div id="voice">There is no game.</div>

    <section id="startScreen">
      <h1>THERE IS NO GAME</h1>
      <p>do not click start</p>
      <button id="startButton">START GAME</button>
    </section>

    <section id="gameScreen">
      <div id="rope"></div>
      <div id="sign">NO GAME</div>
      <div id="vault">
        <div id="firstScrew" class="screw"></div>
      </div>
      <div id="glass"></div>
    </section>

    <section id="deckArea">
      <button id="drawCard">Draw Tool Card</button>
      <p id="deckInfo">Deck: 4 cards</p>
      <div id="tools"></div>
    </section>
  </main>

  <section id="blueScreen">
    <div>
      <h2>SYSTEM ERROR</h2>
      <p>restarting...</p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
