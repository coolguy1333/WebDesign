<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THERE IS NO GAME</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <div id="voice"></div>
    <section id="start" class="center">
      <h1 id="title"></h1>
      <p class="subtitle">click every letter to start</p>
    </section>

    <section id="arena">
      <div id="rope"></div>
      <div id="sign">NO GAME</div>
      <div id="vault"><div class="screw" id="firstScrew"></div></div>
      <div id="glass"></div>
    </section>

    <section id="deckArea">
      <button id="drawCard">Draw Tool Card</button>
      <div id="deckInfo">Deck: 4 cards</div>
      <div id="tools"></div>
    </section>
  </main>

  <section id="blueScreen"><div><h2>SYSTEM ERROR</h2><p>restarting...</p></div></section>
  <script src="app.js"></script>
</body>
</html>
