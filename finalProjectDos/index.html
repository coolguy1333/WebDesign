<!DOCTYPE html>

<html>
    <head>
        <title>tac tic toe</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <h1>tac tic toe</h1>
        </header>
        <main>
            <div class="board">
                <button class="row1column1" onclick="clicked(1,1)"></button>
                <button class="row1column2" onclick="clicked(1,2)"></button>
                <button class="row1column3" onclick="clicked(1,3)"></button>
                <button class="row2column1" onclick="clicked(2,1)"></button>
                <button class="row2column2" onclick="clicked(2,2)"></button>
                <button class="row2column3" onclick="clicked(2,3)"></button>
                <button class="row3column1" onclick="clicked(3,1)"></button>
                <button class="row3column2" onclick="clicked(3,2)"></button>
                <button class="row3column3" onclick="clicked(3,3)"></button>
            </div>
        </main>
        <script src="index.js"></script>
    </body>
</html>
