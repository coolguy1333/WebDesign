<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="./images/favicon.png" type="image/png">
  <title>THERE IS NO GAME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="voice">There is no game. Seriously. Do not press start.</div>

    <section id="startScreen">
      <h1 id="titleLetters">
        <span>T</span><span>H</span><span>E</span><span>R</span><span>E</span>
        <span>I</span><span>S</span>
        <span>N</span><span>O</span>
        <span>G</span><span>A</span><span>M</span><span>E</span>
      </h1>
      <p>do not click start</p>
      <button id="startButton">START GAME</button>
    </section>

    <section id="gameScreen">
      <div id="rope"></div>
      <div id="sign">NO GAME</div>

      <button id="redButton">DO NOT PRESS</button>

      <div id="vault">
        <div class="screw firstScrew topLeft"></div>
        <div class="screw firstScrew topRight"></div>
        <div class="screw firstScrew bottomLeft"></div>
        <div class="screw firstScrew bottomRight"></div>
        <div id="finalScrew" class="screw"></div>
      </div>

      <div id="glass"></div>
    </section>

    <section id="deckArea">
      <button id="pauseButton">Pause</button>
      <button id="drawCard">Draw Tool Card</button>
      <p id="deckInfo">Deck: 4 cards</p>
      <div id="tools">
        <button class="tool" data-tool="scissors">scissors</button>
        <button class="tool" data-tool="hammer">hammer</button>
        <button class="tool" data-tool="screwdriver">screwdriver</button>
        <button class="tool" data-tool="squirrel">squirrel</button>
      </div>
    </section>
  </main>

  <section id="pauseFlash">NO</section>

  <section id="blueScreen">
    <div id="endImage">
      <img src="./images/crash.png" alt="System Crash Picture" />
    </div>
    <div id="endVideo">
      <video id="fullscreen-video" class="video-js vjs-default-skin vjs-big-play-centered" preload="auto" playsinline>
        <source src="./videos/startup.mp4" type="video/mp4" />
      </video>
    </div>
  </section>
  <script src="app.js"></script>
</body>
</html>
