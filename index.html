<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>There Is No Game</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section id="stage" class="stage">
      <div id="titleWrap" class="title-wrap">
        <h1 id="title" class="title" aria-label="THERE IS NO GAME"></h1>
        <p id="subtitle" class="subtitle">don’t click to start</p>
      </div>

      <div id="ropeScene" class="rope-scene hidden" aria-label="A suspicious hanging sign">
        <button id="rope" class="rope" type="button" aria-label="rope"></button>
        <button id="sign" class="wood-sign" type="button" aria-label="wooden sign that says no game">NO GAME</button>
      </div>

      <div id="vaultScene" class="vault-scene hidden" aria-label="A suspicious vault panel">
        <div id="vault" class="vault">
          <div class="vault-glow"></div>
          <button id="firstScrew" class="screw first-screw" type="button" aria-label="vault screw"></button>
          <div id="glass" class="glass hidden" aria-label="sealed glass cover">
            <div id="cracks" class="cracks"></div>
            <div id="screwField" class="screw-field"></div>
          </div>
          <button id="finalScrew" class="screw final-screw hidden" type="button" aria-label="final center screw"></button>
        </div>
      </div>
    </section>

    <p id="narrator" class="narrator">There is no game.</p>

    <nav id="toolDeck" class="tool-deck hidden" aria-label="tool deck">
      <button class="tool" type="button" data-tool="scissors" aria-label="Scissors"><span>✂️</span><small>Scissors</small></button>
      <button class="tool" type="button" data-tool="hammer" aria-label="Hammer"><span>🔨</span><small>Hammer</small></button>
      <button class="tool" type="button" data-tool="screwdriver" aria-label="Screwdriver"><span>🪛</span><small>Screwdriver</small></button>
      <button class="tool" type="button" data-tool="squirrel" aria-label="Squirrel"><span>🐿️</span><small>Squirrel</small></button>
    </nav>
  </main>

  <section id="blueScreen" class="blue-screen hidden" aria-hidden="true">
    <div>
      <h2>SYSTEM ERROR</h2>
      <p>restarting...</p>
      <p class="crash-narrator">…I told you there was no game.</p>
      <pre>ANTI_GAME_EXCEPTION: player_touched_everything
memory dump: 0000 NOPE 0001 WHY</pre>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
